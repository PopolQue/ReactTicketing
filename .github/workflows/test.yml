name: Tests & Migrations

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Build Workspaces
        run: npm run build --workspaces --if-present

      - name: Run vitest
        run: npm run test --workspaces --if-present

      - name: Test Supabase Migrations
        run: |
          supabase start
          supabase status

      - name: Install Playwright Browsers
        run: |
          cd platform && npx playwright install --with-deps

      - name: Run Playwright e2e tests
        run: |
          cd platform
          export VITE_SUPABASE_URL="http://127.0.0.1:54321"
          export VITE_SUPABASE_ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d '=' -f2 | tr -d '"')
          npm run test:e2e

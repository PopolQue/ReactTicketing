name: Tests & Migrations

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd reactticket-core && npm install
          cd ../reactticket && npm install
          cd ../platform && npm install
          cd ../mobile-scanner && npm install

      - name: Security Audit
        run: |
          cd reactticket-core && npm audit --audit-level=high
          cd ../reactticket && npm audit --audit-level=high
          cd ../platform && npm audit --audit-level=high

      - name: Build Libraries
        run: |
          cd reactticket-core && npm run build
          cd ../reactticket && npm run build

      - name: Run vitest
        run: |
          cd reactticket-core && npx vitest run --coverage
          cd ../reactticket && npx vitest run --coverage
          cd ../platform && npx vitest run --coverage

      - name: Upload Core Coverage
        uses: actions/upload-artifact@v7
        with:
          name: reactticket-core-coverage
          path: reactticket-core/coverage/

      - name: Upload React Coverage
        uses: actions/upload-artifact@v7
        with:
          name: reactticket-coverage
          path: reactticket/coverage/

      - name: Upload Platform Coverage
        uses: actions/upload-artifact@v7
        with:
          name: platform-coverage
          path: platform/coverage/

      - name: Test Supabase Migrations
        run: |
          supabase start
          # Supabase CLI automatically applies migrations from supabase/migrations on start.
          # We can also check status.
          supabase status

      - name: Install Playwright Browsers
        run: |
          cd platform && npx playwright install --with-deps

      - name: Run Playwright e2e tests
        run: |
          cd platform
          export VITE_SUPABASE_URL="http://127.0.0.1:54321"
          export VITE_SUPABASE_ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d '=' -f2 | tr -d '"')
          npm run test:e2e

      - name: Validate size limits
        run: |
          cd reactticket && npm run size

      - name: Validate Mobile Scanner Build
        run: |
          cd mobile-scanner && npm run build

name: Tests & Migrations

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: |
          cd platform && npm install
          
      - name: Run vitest
        run: |
          cd platform && npm run test
          
      - name: Test Supabase Migrations
        run: |
          supabase start
          # Supabase CLI automatically applies migrations from supabase/migrations on start.
          # We can also check status.
          supabase status
